services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: takukairo
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: takukairo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takukairo -d takukairo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
